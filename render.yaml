services:
  - type: web
    name: campusloop
    runtime: docker
    plan: free
    numInstances: 1
    healthCheckPath: /api/health
    envVars:
      - key: REQUIRE_EXTERNAL_DB
        value: "true"
      - key: BIND_ADDRESS
        value: 0.0.0.0
      - key: COOKIE_SECURE
        value: "true"
      - key: JDBC_DATABASE_URL
        sync: false
      - key: DATABASE_USER
        sync: false
      - key: DATABASE_PASSWORD
        sync: false
      - key: ADMIN_EMAIL
        sync: false
      - key: ADMIN_PASSWORD
        sync: false
